name: Licenses

# This check is a *required* status check on the main branch. It MUST run on
# every pull request -- including pure documentation PRs that only touch
# `website/**` -- so GitHub always receives a "pass" report for it.
#
# That is why it lives in its own workflow: the main `ci.yml` workflow uses
# `paths-ignore: website/**` to skip the heavy build/test jobs for docs-only
# PRs, which would otherwise leave this required check stuck as "Expected"
# (never reported) forever, blocking merges.
#
# Here `pull_request` intentionally has NO `paths-ignore`, so the cheap
# (timeout-minutes: 5) header scan runs for every PR regardless of what it
# touches.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: licenses-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Apache-2.0 license headers
        run: python3 scripts/ci/check_license_headers.py
