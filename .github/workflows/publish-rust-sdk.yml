# Publish the Rust crate `goosefs-sdk` to crates.io.
#
# Triggers:
#   - workflow_dispatch (Actions → Publish Rust SDK → Run workflow)
#   - push of tags matching v* (e.g. v0.2.0)
#
# Auth (pick one):
#   1. crates.io Trusted Publishing (OIDC) — preferred.
#      On https://crates.io/crates/goosefs-sdk/settings/trusted-publishing :
#        Repository owner: Tencent
#        Repository:       tencent-goosefs-rust-sdk
#        Workflow filename: publish-rust-sdk.yml
#        Environment:      crates-io
#   2. Repo / environment secret CARGO_REGISTRY_TOKEN.
#
# After the first successful run, add required reviewers on the `crates-io`
# GitHub Environment if you want a human gate before upload.

name: Publish Rust SDK

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight only (cargo publish --dry-run); do not upload"
        type: boolean
        default: false
      skip_tests:
        description: "Skip cargo test (CI is assumed green)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-rust-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: crates-io
      url: https://crates.io/crates/goosefs-sdk
    permissions:
      contents: read
      id-token: write
    env:
      HAS_CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches crate version
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          ver="$(awk '
            /^\[package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ {
              gsub(/"/, "", $3); print $3; exit
            }
          ' Cargo.toml)"
          expected="v${ver}"
          actual="${GITHUB_REF_NAME}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "tag ${actual} does not match Cargo.toml (${expected})" >&2
            exit 1
          fi

      - name: Setup Rust
        uses: ./.github/actions/setup

      - name: Authenticate with crates.io (OIDC)
        id: crates_auth
        if: >-
          github.repository == 'Tencent/tencent-goosefs-rust-sdk' &&
          env.HAS_CARGO_TOKEN != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        uses: rust-lang/crates-io-auth-action@v1

      - name: Preflight / publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates_auth.outputs.token }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.skip_tests }}" == "true" ]]; then
            flags+=(--skip-tests)
          fi

          want_publish=0
          if [[ "${{ github.repository }}" == "Tencent/tencent-goosefs-rust-sdk" ]]; then
            if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.dry_run }}" != "true" ]]; then
              want_publish=1
            fi
          fi

          if [[ "${want_publish}" -eq 1 ]]; then
            bash scripts/release/rust.sh --publish ${flags[@]+"${flags[@]}"}
          else
            echo "==> dry-run (no upload)"
            bash scripts/release/rust.sh ${flags[@]+"${flags[@]}"}
          fi
