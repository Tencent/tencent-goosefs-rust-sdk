[workspace]
members = [
    ".",
    "bindings/python",
]
# Prevents cargo from auto-discovering unrelated directories as members.
# Only the root SDK crate and its Python binding are members.
resolver = "2"

[package]
name = "goosefs-sdk"
version = "0.1.9"
edition = "2021"
description = "Goosefs Rust gRPC Client - Direct gRPC client for Goosefs Master/Worker"
license = "Apache-2.0"
authors = ["Goosefs Team"]
readme = "README.md"
repository = "https://github.com/Tencent/tencent-goosefs-rust-sdk"
homepage = "https://tencent.github.io/tencent-goosefs-rust-sdk/"
documentation = "https://tencent.github.io/tencent-goosefs-rust-sdk/"
keywords = ["goosefs", "grpc", "storage", "filesystem", "cache"]
categories = ["network-programming", "filesystem"]
rust-version = "1.88"
exclude = [
    ".idea/*",
    ".codebuddy/*",
    ".DS_Store",
    "**/.DS_Store",
    "docs/CLIENT_PAGE_CACHE_DESIGN.md",
    "docs/GOOSEFS_LANCE_GRPC_DESIGN.md",
    "docs/release/*",
    "target/*",
    "website/*",
]

[lib]
name = "goosefs_sdk"

[features]
# Keep the core gRPC client dependency graph minimal for downstream crates.
default = []

# Process-local metadata status/listing cache.
metadata-cache = ["dep:lru"]

# Disk-backed client page cache. The io_uring backend is a separate opt-in so
# non-Linux consumers can use the portable tokio::fs implementation alone.
page-cache = ["dep:foyer-common", "dep:foyer-memory", "tokio/fs"]
page-cache-io-uring = ["page-cache", "dep:io-uring", "dep:libc"]

# Pushgateway exporter pulls in `reqwest` (HTTP/TLS stack). Disabling this
# feature significantly shrinks the dependency graph for downstream crates
# that only need the gRPC client.
metrics-pushgateway = ["dep:reqwest"]

# Opt-in re-generation of protobuf code from .proto files. Pulls in
# `tonic-prost-build` (which depends on `prettyplease`, `proc-macro2`, etc.)
# only when explicitly requested. Triggered together with the
# `GOOSEFS_SDK_REGEN_PROTO=1` env var by build.rs.
regen-proto = ["dep:tonic-prost-build"]

# Preserve the complete runtime client for bindings and applications that want
# every optional data-plane capability. Proto regeneration remains build-only.
full-client = [
    "metadata-cache",
    "metrics-pushgateway",
    "page-cache-io-uring",
]

[dependencies]
# `default-features = false` removes the `router` feature (and its `axum`,
# `matchit`, `axum-core`, `tower-http` chain) which is server-side only.
# The SDK only consumes generated clients, so keep the channel half of
# transport without Tonic's server stack. `codegen` is required by the
# tonic-prost generated client stubs.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14.1"
# Trim `tokio = "full"` to the concrete features actually used by the SDK
# (single-thread-capable runtime, macros, sync primitives, IO, time).
# Tonic's channel enables Tokio networking through hyper-util.
# `fs` is opt-in via the `page-cache` feature.
tokio = { version = "1.23", features = ["rt", "macros", "sync", "time", "io-util"] }
tokio-stream = "0.1.14"
bytes = "1.11.1"
thiserror = "2"
tracing = "0.1"
dashmap = "6"
# Fast integer-to-string formatting (): replaces the `write!` /
# `format!("{}", n)` on the `host:port` keying hot path. `itoa::write` skips
# the `core::fmt` machinery entirely, which shows up in flamegraphs as
# `core::fmt::write` / `Formatter::write_fmt`. Pulled in as a direct dep
# (was already in the graph transitively) so the helper function can use it
# without per-call-site `use` ceremony. Used on the `host:port` keying hot path.
itoa = "1"
# Lock-free atomic Arc swap, used by `MasterClient` to publish the authenticated
# (channel + SASL guard) snapshot. Replaces the prior `RwLock<Client>` so that
# the `get_status` hot-path becomes wait-free, while still keeping
# `(channel, sasl_guard)` together as a single atomically-swapped unit during
# HA failover (`reconnect`).
arc-swap = "1"
# Stable, spec-defined, high-performance hash (xxHash3) — used for ephemeral /
# in-process fingerprints (dir allocation, page-lock striping, worker-list
# fingerprint) and on-disk page-store bucket selection. **Not** used for
# block→worker consistent hashing (that is the in-tree Guava-compatible
# murmur3_128 in `src/block/murmur3.rs`).
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
# Bounded LRU backing the client metadata cache. Floor is 0.16.3 for
# RUSTSEC-2026-0002 (IterMut Stacked Borrows).
lru = { version = "0.18.1", optional = true }
rand = "0.9.1"
uuid = { version = "1.2", features = ["v4"] }
hostname = "0.4"
# Used only by the metrics pushgateway exporter; gated behind a feature so
# downstream gRPC-only consumers can opt out.
reqwest = { version = "^0.12", features = ["rustls-tls"], default-features = false, optional = true }
# foyer sharded intrusive eviction containers. Backs both the page metadata
# cache (`src/cache/manager.rs`) and the io_uring page fd cache
# (`src/cache/store/uring/store.rs`), replacing moka. See
# the foyer migration design doc, kept in the `goosefs-lance-tests`
# repository under `docs/design/`.
#
# Owning metadata, eviction order and byte accounting in one structure is what
# makes victim selection O(1); the previous split forced an O(resident pages)
# scan to find a victim (~7ms at 100k pages).
#
# Deliberately NOT the umbrella `foyer` crate: we only need the in-memory
# cache, and the umbrella pulls in `foyer-storage`'s block engine / compression
# / io_uring device stack, which fully overlaps our own `PageStore`.
# `Cache`/`CacheBuilder`/`*Config` live in foyer-memory, `Event`/`EventListener`
# in foyer-common. Published MSRV is 1.85.0 for both (the 1.91 in foyer's
# README is its dev-workspace toolchain, not a consumer constraint).
foyer-memory = { version = "0.22", optional = true }
foyer-common = { version = "0.22", optional = true }
# Drives variable-sized batches of cache page reads concurrently without
# spawning per-page tasks; already used by benchmarks and now required on the
# cache hit hot path.
futures = "0.3"
# Fast, dependency-free PRNG used by the MasterClientPool P2C scheduler
# (Power of Two Choices). `fastrand` is ~10x faster than `rand` and its
# statistical quality is more than sufficient for load-balancing candidate
# selection — the theoretical P2C bound only requires uniform sampling,
# not cryptographic strength.
fastrand = "2"

# Unix-only: raw syscall wrappers used by the io_uring page-cache backend.
# Already in the dependency graph transitively; declared directly so the
# cache store can call into it.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

# Linux-only: io_uring page-cache backend (CLIENT_PAGE_CACHE_DESIGN.md).
# The io-uring crate provides the raw syscall wrappers; `libc` is already
# declared for unix targets above. Only pulled in on Linux so the crate
# continues to build on macOS / Windows.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }

[build-dependencies]
# Optional: only required when regenerating protobuf code in-tree.
# See build.rs and the `regen-proto` feature.
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
# Tests/examples may rely on the broader tokio feature set.
tokio = { version = "1.23", features = ["full", "test-util"] }
# Statistical micro-benchmarks for the GetFileStatus optimization
# (see benchmarks/master_hotpath.rs).
# `default-features = false` drops the optional `rayon`/`html_reports` chain;
# `cargo_bench_support` enables `cargo bench` integration without the rest.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Custom benchmark target. `harness = false` is required so that criterion's
# own `main()` is used instead of the libtest harness. Lives under
# `benchmarks/` (alongside the runnable end-to-end benchmarks) rather than the
# default `benches/`, so its path is declared explicitly.
[[bench]]
name = "master_hotpath"
path = "benchmarks/master_hotpath.rs"
harness = false

# Runnable end-to-end benchmarks / repro cases live under `benchmarks/`.
# They are kept as `example` targets (not `[[bench]]`) so they build & run with
# the familiar `cargo run --release --example <name>` UX and can use
# dev-dependencies. Cargo only auto-discovers examples under `examples/`, so the
# relocated ones must be declared explicitly with their path.
[[example]]
name = "partv_perf_verify"
path = "benchmarks/partv_perf_verify.rs"

[[example]]
name = "repro_concurrent_write"
path = "benchmarks/repro_concurrent_write.rs"

# Cache evictor A/B benchmark: LRU vs LFU vs S3-FIFO under concurrent cache-hit
# workloads. Exercises the full LocalCacheManager::get() path (metadata lookup
# + evictor on_access + PageStore IO).
[[example]]
name = "cache_evictor_bench"
path = "benchmarks/cache_evictor_bench.rs"
required-features = ["page-cache"]

# P3 benchmark: io_uring vs tokio::fs page-cache backend comparison.
# Local-only (no GooseFS cluster needed). Runs on any platform; io_uring path
# is #[cfg(target_os = "linux")]-gated. See
# docs/CLIENT_PAGE_CACHE_DESIGN.md .
[[example]]
name = "cache_uring_bench"
path = "benchmarks/cache_uring_bench.rs"
required-features = ["page-cache-io-uring"]

[[example]]
name = "metrics_pushgateway"
required-features = ["metrics-pushgateway"]

[[example]]
name = "page_cache_demo"
required-features = ["page-cache"]

[[example]]
name = "reader_page_cache_demo"
required-features = ["page-cache"]

[[test]]
name = "metadata_cache_e2e"
required-features = ["metadata-cache"]

[[test]]
name = "page_cache_consistency"
required-features = ["page-cache"]

[[test]]
name = "page_cache_e2e"
required-features = ["page-cache"]

# Release profile tuning for the SDK hot paths.
#
# Rationale:
# - `lto = "fat"` enables cross-crate inlining, which is essential for the
#   tonic + prost generated client stubs (heavily generic, so without LTO most
#   hot calls remain out-of-line).
# - `codegen-units = 1` lets LLVM see the entire crate at once, allowing
#   better inlining decisions across modules. Compile time is longer but
#   release-build runtime perf improves measurably.
# - We deliberately do NOT enable `panic = "abort"`: that would change panic
#   semantics (no unwinding), affecting any consumer that relies on
#   `catch_unwind` / Drop ordering on panic. Keeping the default `unwind`
#   behaviour preserves backward-compatible panic handling.
[profile.release]
lto = "fat"
codegen-units = 1
# strip = true removes debug symbols (DWARF / PDB / Mach-O debug) from the
# final binary. For the Python abi3 wheel this is free size reduction; for the
# SDK crate it strips the library, so downstream consumers that want backtraces
# should build with `debug=1` or use their own profile.
# debug = false is the default for release, made explicit here for clarity.
strip = true
debug = false
